# Minimal local example, unattended mode (compiled by esphome-compile.sh).
esphome:
  name: esp32-tang
  friendly_name: ESP32 Tang

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

web_server:
  port: 80

external_components:
  - source:
      type: local
      path: ../components
    components: [tang_server]

tang_server:
  id: tang_component
  unattended: true
  seed: !secret tang_seed

text_sensor:
  - platform: tang_server
    tang_server_id: tang_component
    signing_thumbprint:
      name: "Tang Signing Thumbprint"
