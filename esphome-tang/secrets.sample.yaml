# Copy to secrets.yaml and replace EVERY value. secrets.yaml is git-ignored.
# Never commit real values. Generate random values like this:
#   api_key:       openssl rand -base64 32
#   tang_seed:     openssl rand -hex 32     (one DIFFERENT seed per device)
#   passwords:     use a long random string

wifi_ssid: "REPLACE_ME"
wifi_password: "REPLACE_ME"

# Password for the fallback access point (8+ characters).
ap_password: "REPLACE_ME"

# ESPHome native API encryption key (32 bytes, base64).
api_key: "REPLACE_ME"
ota_password: "REPLACE_ME"

# Password mode only (esp32tang.yaml, tang_server.yaml).
tang_initial_password: "REPLACE_ME"

# Unattended mode only (esp32tang-unattended.yaml). 64 hex chars = 256 bits.
# Anyone who gets this value (or the firmware image) can act as this server.
tang_seed: "REPLACE_WITH_64_HEX_CHARS"
# Rotation only: previous seeds, see README.
# tang_old_seed: "REPLACE_WITH_64_HEX_CHARS"
